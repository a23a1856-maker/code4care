{% extends "base.html" %}
{% block title %}Ralat &middot; CODE4CARE{% endblock %}
{% block page_name %}error{% endblock %}
{% block content %}
<section class="card narrow" data-error="{{ error_code }}" role="alert">
  <h1>{{ error_title }}</h1>
  <p class="lead">{{ error_message }}</p>
  <p class="actions">
    <a class="button" href="/">Kembali ke laman utama</a>
    {% if not user %}<a class="button ghost" href="/login">Masuk semula</a>{% endif %}
  </p>
  <p class="fineprint">Rujukan ralat: <code>{{ error_code }}</code></p>
</section>
{% endblock %}
