<figure class="medicine-photo" data-image="{{ 'present' if has_image else 'missing' }}">
  {% if has_image %}
    <img src="/medicines/{{ medicine.id }}/image?v={{ image_version }}"
         alt="Gambar {{ medicine.name }}" loading="lazy" width="320" height="240">
  {% else %}
    <div class="photo-placeholder" role="img" aria-label="Tiada gambar ubat">
      <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <rect x="6" y="20" width="52" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M20 20v-6a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4v6" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M26 35h12M32 29v12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span>Tiada gambar</span>
    </div>
  {% endif %}

  {% if can_manage %}
    <figcaption class="photo-manage no-print">
      {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
      {% if notice %}<p class="notice">{{ notice }}</p>{% endif %}
      <form class="stack compact" method="post"
            action="/medicines/{{ medicine.id }}/image/upload"
            enctype="multipart/form-data"
            hx-post="/medicines/{{ medicine.id }}/image/upload"
            hx-target="closest .medicine-photo" hx-swap="outerHTML"
            hx-encoding="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label class="hint" for="image-{{ medicine.id }}">JPG, PNG atau WebP &middot; maksimum 5 MB</label>
        <input id="image-{{ medicine.id }}" type="file" name="image"
               accept="image/jpeg,image/png,image/webp" required>
        <button class="button small" type="submit">
          {{ 'Tukar gambar' if has_image else 'Muat naik gambar' }}
        </button>
      </form>
      {% if has_image %}
        <form method="post" action="/medicines/{{ medicine.id }}/image/remove"
              hx-post="/medicines/{{ medicine.id }}/image/remove"
              hx-target="closest .medicine-photo" hx-swap="outerHTML">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="link-button" type="submit">Buang gambar</button>
        </form>
      {% endif %}
    </figcaption>
  {% endif %}
</figure>
